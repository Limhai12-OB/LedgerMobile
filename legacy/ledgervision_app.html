<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LedgerVision · Your business, in focus</title>
    <style>
      :root {
        --ink: #172d2c;
        --muted: #74817d;
        --green: #216652;
        --lime: #dcf1a7;
        --bg: #f5f6f2;
        --line: #e4e9e2;
        --red: #b95343;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px "Segoe UI",
          system-ui,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #82bca5;
        outline-offset: 3px;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
      }
      button:hover {
        filter: brightness(0.96);
      }
      .layout {
        display: grid;
        grid-template-columns: 232px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: #fff;
        border-right: 1px solid var(--line);
        padding: 32px 22px;
        position: fixed;
        inset: 0 auto 0 0;
        width: 232px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 21px;
        font-weight: 750;
        letter-spacing: -0.8px;
      }
      .logo {
        background: var(--green);
        color: var(--lime);
        border-radius: 12px;
        padding: 7px 10px;
        font-size: 24px;
      }
      .brand small {
        font-size: 10px;
        letter-spacing: 2px;
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .workspace {
        margin: 35px 0 26px;
        padding: 14px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .workspace b {
        display: block;
        font-size: 13px;
      }
      .muted,
      small {
        color: var(--muted);
      }
      .nav {
        display: grid;
        gap: 7px;
      }
      .nav button {
        text-align: left;
        padding: 13px;
        border-radius: 9px;
        display: flex;
        gap: 12px;
        align-items: center;
        color: #687570;
        font-weight: 600;
      }
      .nav button.active {
        background: #eaf2e9;
        color: var(--green);
      }
      .nav svg {
        width: 19px;
        height: 19px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding-top: 25px;
      }
      .demo-note {
        padding: 15px;
        background: #f4f7ed;
        border-radius: 12px;
        font-size: 12px;
        line-height: 1.7;
        margin-bottom: 20px;
      }
      .role {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
      }
      main {
        grid-column: 2;
        min-width: 0;
      }
      .topbar {
        height: 83px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: #ffffff99;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .badge {
        font-size: 11px;
        letter-spacing: 0.5px;
        background: #eaf1df;
        color: var(--green);
        padding: 6px 10px;
        border-radius: 20px;
      }
      .avatar {
        border-radius: 50%;
        background: #e5eadc;
        padding: 11px;
        font-weight: 650;
      }
      .content {
        max-width: 1400px;
        margin: auto;
        padding: 32px 40px 40px;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 27px;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
        margin: 0 0 7px;
        font-weight: 650;
      }
      h2 {
        font-size: 16px;
        margin: 0;
        font-weight: 650;
      }
      p {
        line-height: 1.65;
      }
      .heading p {
        margin: 0;
        color: var(--muted);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 9px;
        padding: 11px 16px;
        background: white;
        border: 1px solid var(--line);
        font-weight: 600;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      .btn svg {
        width: 17px;
        height: 17px;
      }
      .filters {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .filters select,
      .filters input {
        padding: 10px 13px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
      }
      .filters .period {
        margin-left: auto;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 24px;
      }
      .stat {
        background: white;
        border: 1px solid var(--line);
        padding: 22px;
        border-radius: 13px;
      }
      .stat.featured {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .stat .label {
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
      }
      .stat.featured .label,
      .stat.featured small {
        color: #cfdfd4;
      }
      .stat .value {
        font-size: 29px;
        letter-spacing: -1px;
        font-weight: 650;
        margin: 15px 0 9px;
      }
      .stat small {
        font-size: 11px;
      }
      .stat svg {
        width: 18px;
        height: 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.8fr) minmax(280px, 1fr);
        gap: 22px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 23px;
        min-width: 0;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .link {
        color: var(--green);
        font-size: 12px;
        font-weight: 650;
        padding: 5px;
      }
      .legend {
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: var(--muted);
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: var(--green);
        border-radius: 50%;
        margin-right: 5px;
      }
      .dot.expense {
        background: #bed2a1;
      }
      .chart {
        height: 213px;
        display: flex;
        gap: 16px;
        padding-top: 10px;
      }
      .axis {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-bottom: 25px;
        font-size: 10px;
        color: var(--muted);
      }
      .bars {
        flex: 1;
        display: flex;
        justify-content: space-around;
        border-bottom: 1px solid var(--line);
        background: repeating-linear-gradient(
          to top,
          transparent 0,
          transparent 44px,
          #eef1ec 45px,
          #eef1ec 46px
        );
        gap: 10px;
      }
      .bar-group {
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 5px;
        position: relative;
        padding-bottom: 25px;
        max-width: 64px;
      }
      .bar {
        width: 22px;
        border-radius: 5px 5px 0 0;
        background: var(--green);
        min-height: 2px;
      }
      .bar.expense {
        background: #bed2a1;
      }
      .bar-group small {
        position: absolute;
        bottom: 4px;
        font-size: 10px;
      }
      .insight {
        background: #f3f6eb;
        border: 1px solid #e6edda;
        padding: 15px;
        border-radius: 10px;
        margin-top: 12px;
      }
      .insight p {
        font-size: 12px;
        margin: 7px 0;
        color: #607067;
      }
      .insight b {
        font-size: 13px;
      }
      .insight-label {
        color: var(--green);
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid #edf0eb;
      }
      .row:last-child {
        border: 0;
      }
      .row .grow {
        flex: 1;
        min-width: 0;
      }
      .row b {
        font-size: 13px;
        display: block;
        overflow-wrap: anywhere;
      }
      .row small {
        display: block;
        font-size: 11px;
        margin-top: 5px;
      }
      .row-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: #f0f3eb;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .row-icon svg {
        width: 18px;
        height: 18px;
      }
      .positive {
        color: var(--green);
      }
      .negative {
        color: var(--red);
      }
      .amount {
        font-weight: 650;
        white-space: nowrap;
      }
      .full {
        grid-column: 1/-1;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        margin-top: 22px;
      }
      .branch-row {
        width: 100%;
        text-align: left;
      }
      .progress {
        height: 5px;
        border-radius: 8px;
        background: #edf1e8;
        margin-top: 10px;
        overflow: hidden;
      }
      .progress span {
        display: block;
        height: 100%;
        background: #8aab72;
        border-radius: 8px;
      }
      .footer {
        color: var(--muted);
        font-size: 11px;
        margin-top: 24px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .empty {
        text-align: center;
        padding: 45px 20px;
        color: var(--muted);
      }
      .transaction-row {
        width: 100%;
        text-align: left;
      }
      .transaction-row:hover {
        background: #fafbf8;
      }
      .chat {
        max-width: 800px;
        margin: auto;
      }
      .bubble {
        padding: 18px 21px;
        border-radius: 14px;
        background: white;
        border: 1px solid var(--line);
        margin: 14px 0;
        line-height: 1.75;
        white-space: pre-wrap;
      }
      .bubble.user {
        background: #e9f0df;
        margin-left: 50px;
      }
      .chat-form {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      .chat-form input {
        flex: 1;
        min-width: 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .suggestions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .suggestions button {
        font-size: 12px;
      }
      .capture-panel {
        max-width: 720px;
        margin: auto;
      }
      .drop {
        border: 2px dashed #cdd9c3;
        background: #f8faf4;
        padding: 38px 20px;
        text-align: center;
        border-radius: 12px;
      }
      .drop svg {
        width: 35px;
        height: 35px;
        color: var(--green);
      }
      .drop input {
        max-width: 100%;
        margin-top: 15px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 17px;
      }
      .field {
        display: grid;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
      }
      .field input,
      .field select {
        width: 100%;
        border: 1px solid #dce3d8;
        border-radius: 8px;
        padding: 12px;
        background: #fff;
        color: var(--ink);
      }
      .field.full {
        grid-column: 1/-1;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 27px;
        width: 520px;
        max-width: calc(100% - 28px);
        max-height: 90vh;
        overflow: auto;
        color: var(--ink);
        box-shadow: 0 25px 100px #162c2930;
      }
      dialog::backdrop {
        background: #14292366;
        backdrop-filter: blur(4px);
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 23px;
      }
      .close {
        font-size: 24px;
        padding: 3px 8px;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 13px 22px;
        border-radius: 10px;
        z-index: 10;
        box-shadow: 0 5px 25px #0002;
        max-width: 90%;
        font-size: 13px;
      }
      .toast:empty {
        display: none;
      }
      .mobile-nav {
        display: none;
      }
      .receipt-preview {
        max-height: 160px;
        max-width: 100%;
        display: block;
        margin: 15px auto;
      }
      .health {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .ring {
        width: 90px;
        height: 90px;
        flex-shrink: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(var(--green) var(--score), #e9eee1 0);
      }
      .ring span {
        background: white;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 650;
      }
      .hide {
        display: none !important;
      }
      @media (min-width: 1500px) {
        .content {
          padding-top: 40px;
        }
      }
      @media (max-width: 1100px) {
        .sidebar {
          width: 195px;
          padding: 25px 15px;
        }
        .layout {
          grid-template-columns: 195px 1fr;
        }
        .content {
          padding: 25px;
        }
        .topbar {
          padding: 0 25px;
        }
        .stats {
          gap: 10px;
        }
        .stat {
          padding: 17px;
        }
        .stat .value {
          font-size: 24px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .two {
          grid-template-columns: 1fr 1fr;
        }
        .grid > .card:last-child {
          display: block;
        }
      }
      @media (max-width: 700px) {
        .layout {
          display: block;
        }
        .sidebar {
          display: none;
        }
        .topbar {
          height: 68px;
          padding: 0 20px;
        }
        .topbar-right {
          gap: 10px;
        }
        .topbar .muted {
          font-size: 12px;
        }
        .content {
          padding: 25px 18px 100px;
        }
        .heading {
          align-items: flex-start;
        }
        .heading h1 {
          font-size: 25px;
        }
        .heading p {
          font-size: 12px;
          max-width: 230px;
        }
        .heading > .btn {
          padding: 10px;
          font-size: 12px;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
          margin-bottom: 17px;
        }
        .stat {
          padding: 16px;
        }
        .stat .value {
          font-size: 25px;
        }
        .stat small {
          font-size: 10px;
        }
        .grid,
        .two {
          grid-template-columns: 1fr;
          gap: 17px;
        }
        .two {
          margin-top: 17px;
        }
        .card {
          padding: 19px;
        }
        .filters select {
          max-width: 48%;
          font-size: 12px;
        }
        .filters .period {
          margin-left: 0;
        }
        .mobile-nav {
          display: flex;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: #fffffff5;
          backdrop-filter: blur(12px);
          border-top: 1px solid var(--line);
          z-index: 4;
          justify-content: space-around;
          padding: 9px 3px max(9px, env(safe-area-inset-bottom));
        }
        .mobile-nav button {
          font-size: 10px;
          display: grid;
          justify-items: center;
          gap: 5px;
          color: var(--muted);
          min-width: 55px;
          padding: 5px;
        }
        .mobile-nav button.active {
          color: var(--green);
          font-weight: 700;
        }
        .mobile-nav svg {
          width: 21px;
          height: 21px;
        }
        .toast {
          bottom: 85px;
        }
        .footer {
          font-size: 10px;
        }
        .form-grid {
          gap: 13px;
        }
        .legend {
          gap: 9px;
        }
        .badge {
          font-size: 9px;
        }
        .chat-form .btn {
          padding: 12px;
        }
        .branch-row .amount {
          font-size: 12px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .content {
          animation: appear 0.25s ease;
        }
        @keyframes appear {
          from {
            opacity: 0.6;
            transform: translateY(4px);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
      }

      /* Keep the app sized to its simulated mobile viewport. */
      html,
      body {
        height: 100%;
        scrollbar-width: thin;
        scrollbar-color: #c8d2c0 transparent;
      }
      @media (max-width: 700px) {
        .topbar {
          position: sticky;
          top: 0;
          z-index: 3;
          background: #f9faf6;
        }
        .heading {
          flex-wrap: wrap;
        }
        .heading p {
          max-width: none;
        }
        .heading > .btn {
          min-height: 42px;
        }
        .content {
          padding-bottom: 110px;
        }
        .filters input {
          max-width: 100%;
          min-width: 0;
        }
        .filters .period {
          margin-left: 0;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .card .filters {
          gap: 8px;
        }
        .row .amount {
          font-size: 12px;
        }
        .mobile-nav button {
          min-height: 48px;
        }
        .chat-form input {
          font-size: 16px;
        }
        .field input,
        .field select {
          font-size: 16px;
        }
        dialog {
          max-height: calc(100dvh - 32px);
        }
      }
    </style>
  <link rel="stylesheet" href="voice-invoice.css">
</head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo">▥</span>
          <div>LedgerVision<small>BUSINESS IN FOCUS</small></div>
        </div>
        <div class="workspace">
          <span class="row-icon">☕</span>
          <div><b>Dara's Coffee</b><small>Business workspace</small></div>
        </div>
        <nav class="nav" aria-label="Main navigation"></nav>
        <div class="sidebar-bottom">
          <div class="demo-note">
            <b>A little clarity. A lot of possibility.</b><br />Your finances,
            all in one place.<br /><span class="muted"
              >Interactive demo · local data</span
            >
          </div>
          <label class="field"
            >Preview as<select id="role" class="role">
              <option value="owner">Dara · Business owner</option>
              <option value="manager">Sokha · BKK manager</option>
            </select></label
          >
        </div>
      </aside>
      <main>
        <header class="topbar">
          <span id="breadcrumb">Workspace / Overview</span>
          <div class="topbar-right">
            <span class="badge">● DEMO WORKSPACE</span
            ><button
              class="avatar"
              data-page="settings"
              aria-label="Open profile and settings"
            >
              DS
            </button>
          </div>
        </header>
        <div id="content" class="content"></div>
      </main>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation"></nav>
    <dialog id="modal"></dialog>
    <div class="toast" role="status" aria-live="polite" id="toast"></div>
    <script>
      "use strict";
      const paths = {
        home: "M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z",
        transactions: "M5 3h14v18l-3-2-4 2-4-2-3 2V3m4 5h6m-6 4h6",
        capture: "M4 7h4l2-3h4l2 3h4v13H4z M16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0",
        ai: "m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3z",
        reports: "M4 20h16M7 16V9m5 7V4m5 12v-5",
        settings: "M4 7h16M4 17h16M8 4v6m8 4v6",
        plus: "M12 5v14M5 12h14",
        up: "M5 17 17 5M5 5h12v12",
        down: "m5 7 12 12M5 19h12V7",
        download: "M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5",
        branch: "M3 9h18L19 3H5zM5 9v12h14V9M9 21v-7h6v7",
      };
      const icon = (n) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n] || paths.transactions}"/></svg>`;
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>

            e.preventDefault();
            let values = Object.fromEntries(new FormData(e.target));
            values.name = values.name.trim();
            if (!values.name) {
              e.target.elements.name.setCustomValidity(
                "Enter a merchant or description.",
              );
              e.target.elements.name.reportValidity();
              return;
            }
            values.amount = Number(values.amount);
            values.id = existing
              ? id
              : Math.max(0, ...transactions.map((t) => t.id)) + 1;
            if (state.role === "manager") values.branch = "BKK";
            if (existing)
              transactions = transactions.map((t) =>
                t.id === id ? values : t,
              );
            else transactions.push(values);
            let persisted = save();
            state.month = values.date.slice(0, 7);
            state.branch = values.branch;
            closeModal();
            navigate("transactions");
            notify(
              persisted
                ? "Transaction saved. Your dashboard is up to date."
                : "Transaction saved for this session only.",
            );
          });
        document
          .querySelector('[name="name"]')
          .addEventListener("input", (e) => e.target.setCustomValidity(""));
      }
      function uploadReceipt(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (
          !["image/jpeg", "image/png", "image/webp"].includes(file.type) ||
          file.size > 5 * 1024 * 1024
        ) {
          notify("Choose a JPG, PNG or WebP image under 5 MB.");
          e.target.value = "";
          return;
        }
        if (receiptURL) URL.revokeObjectURL(receiptURL);
        receiptURL = URL.createObjectURL(file);
        transactionForm(null, { note: "Entered from receipt: " + file.name });
      }
      function exportCSV() {
        let rows = state.page === "transactions" ? filtered() : scoped();
        const cell = (v) =>
          '"' +
          String(v)
            .replace(/^[=+@-]/, "'$&")
            .replace(/"/g, '""') +
          '"';
        let csv = [
          [
            "Date",
            "Merchant",
            "Category",
            "Type",
            "Branch",
            "Amount USD",
            "Note",
          ],
          ...rows.map((t) => [
            t.date,
            t.name,
            t.category,
            t.type,
            t.branch,
            t.amount,
            t.note || "",
          ]),
        ]
          .map((r) => r.map(cell).join(","))
          .join("\r\n");
        let url = URL.createObjectURL(
          new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }),
        );
        let a = document.createElement("a");
        a.href = url;
        a.download = `ledgervision-${state.month}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify(`Exported ${rows.length} transactions`);
      }
      document.addEventListener("click", (e) => {
        let b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.page) navigate(b.dataset.page);
        if (b.hasAttribute("data-add") || b.hasAttribute("data-manual"))
          transactionForm();
        if (b.dataset.edit) transactionForm(Number(b.dataset.edit));
        if (b.dataset.branch) {
          state.branch = b.dataset.branch;
          navigate("reports");
        }
        if (b.hasAttribute("data-close")) closeModal();
        if (b.dataset.ask) ask(b.dataset.ask);
        if (b.hasAttribute("data-export")) exportCSV();
        if (b.hasAttribute("data-sample"))
          transactionForm(null, {
            name: "Angkor Market",
            amount: 125,
            category: "Ingredients",
            note: "Simulated receipt extraction · Sample receipt",
            sample: true,
          });
        if (b.dataset.delete) {
          let id = Number(b.dataset.delete);
          openDelete(id);
        }
        if (b.hasAttribute("data-reset"))
          openModal(
            `<div class="dialog-head"><h2>Reset your demo workspace?</h2><button class="close" data-close aria-label="Close">×</button></div><p>This removes your demo changes and restores the original sample transactions.</p><div class="form-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="confirm-reset">Reset demo</button></div>`,
          );
        if (b.id === "confirm-reset") {
          transactions = seed();
          save();
          messages = [];
          state.month = "2026-09";
          state.branch = state.role === "manager" ? "BKK" : "all";
          closeModal();
          render();
          notify("Demo data restored");
        }
        if (b.id === "confirm-delete") {
          transactions = transactions.filter(
            (t) => t.id !== Number(b.dataset.id),
          );
          save();
          closeModal();
          render();
          notify("Transaction deleted");
        }
      });
      function openDelete(id) {
        modal.innerHTML = `<div class="dialog-head"><h2>Delete this transaction?</h2><button class="close" data-close aria-label="Close">×</button></div><p>It will be removed from your ledger and dashboard totals.</p><div class="form-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="confirm-delete" data-id="${id}">Delete transaction</button></div>`;
      }
      document
        .getElementById("role")
        .addEventListener("change", (e) => setRole(e.target.value));
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          const r = modal.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeModal();
        }
      });
      modal.addEventListener("cancel", () => {
        if (receiptURL) {
          URL.revokeObjectURL(receiptURL);
          receiptURL = null;
        }
      });
      render();
      window.addEventListener("message", (e) => {
        if (
          e.source === window.parent &&
          e.data?.type === "ledgervision-set-role"
        )
          setRole(e.data.role);
      });
    </script>
  <script src="voice-invoice.js"></script>
</body>
</html>
